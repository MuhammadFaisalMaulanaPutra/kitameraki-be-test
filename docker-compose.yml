# Back-end only stack: Azure Cosmos DB emulator + Azurite (Blob Storage) + Task API.
# Usage: docker compose up --build   (API: http://localhost:7071/api, Swagger: http://localhost:7071/api/docs)
name: kitameraki-task-api

services:
  cosmosdb:
    # vNext emulator: runs natively on x64 and ARM64 (Apple Silicon), HTTP by default.
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    command: ["--protocol", "http"]
    environment:
      ENABLE_EXPLORER: "true"
      ENABLE_TELEMETRY: "false"
    ports:
      - "8081:8081" # Cosmos DB gateway
      - "1234:1234" # Data Explorer UI
    volumes:
      - cosmos-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/ready > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  azurite:
    # Azure Storage emulator (multi-arch: x64 and ARM64). Blob service only: uploaded files of File picker values.
    image: mcr.microsoft.com/azure-storage/azurite:3.38.0
    command:
      [
        "azurite-blob",
        "--blobHost", "0.0.0.0",
        "--blobPort", "10000",
        "--location", "/data",
        "--loose",
        "--skipApiVersionCheck",
      ]
    ports:
      - "10000:10000" # Blob service
    volumes:
      - azurite-data:/data
    healthcheck:
      # The image is Node-based: check that the blob endpoint accepts TCP connections.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(10000, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  api:
    build: .
    environment:
      NODE_ENV: production
      PORT: 7071
      TRUST_PROXY: 1
      COSMOS_ENDPOINT: http://cosmosdb:8081
      # Well-known public key of the local emulator (not a secret).
      COSMOS_KEY: C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==
      COSMOS_DATABASE_ID: TaskApp
      COSMOS_ENABLE_ENDPOINT_DISCOVERY: "false"
      COSMOS_AUTO_CREATE_RESOURCES: "true"
      # Well-known public key of the Azurite dev account "devstoreaccount1" (documented by Microsoft, not a secret).
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      AZURE_STORAGE_FILES_CONTAINER: task-files
      AZURE_STORAGE_AUTO_CREATE_CONTAINER: "true"
      FILE_MAX_SIZE_BYTES: 5242880
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "7071:7071"
    depends_on:
      cosmosdb:
        condition: service_healthy
      azurite:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cosmos-data:
  azurite-data:
