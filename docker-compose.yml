services:
  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    container_name: cosmos-emulator
    ports:
      - "8081:8081"
      - "1234:1234"
    environment:
      PROTOCOL: http
      PORT: 8081
      EXPLORER_PORT: 1234
      ENABLE_EXPLORER: true
    volumes:
      - cosmos-data:/data
    restart: unless-stopped

volumes:
  cosmos-data:
