name: kitameraki-be

services:
  api:
    platform: linux/amd64
    image: kitameraki-be-api:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AZURE_FUNCTIONS_ENVIRONMENT: Development
      FUNCTIONS_WORKER_RUNTIME: node
      FUNCTIONS_NODE_BLOCK_ON_ENTRY_POINT_ERROR: 'true'
      AzureWebJobsStorage: 'DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;'
      ORGANIZATION_ID: 00000000-0000-4000-8000-000000000001
      COSMOS_CONNECTION_STRING: 'AccountEndpoint=http://cosmos:8081/;AccountKey=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==;'
      COSMOS_DATABASE_NAME: TaskApp
      COSMOS_TASKS_CONTAINER_NAME: Tasks
      COSMOS_FORM_SETTINGS_CONTAINER_NAME: FormSettings
      ALLOWED_ORIGIN: http://localhost:5173
      MAX_REQUEST_BODY_BYTES: '262144'
      SLOW_COSMOS_OPERATION_MS: '250'
    depends_on:
      azurite:
        condition: service_healthy
      cosmos-init:
        condition: service_completed_successfully
    ports:
      - '7071:80'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1/api/form-settings',
          {headers:{'X-Organization-Id':process.env.ORGANIZATION_ID}})
          .then(response => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  cosmos-init:
    platform: linux/amd64
    image: kitameraki-be-api:local
    entrypoint: ['node', 'dist/src/db/provision.js']
    environment:
      AZURE_FUNCTIONS_ENVIRONMENT: Development
      ORGANIZATION_ID: 00000000-0000-4000-8000-000000000001
      COSMOS_CONNECTION_STRING: 'AccountEndpoint=http://cosmos:8081/;AccountKey=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==;'
      COSMOS_DATABASE_NAME: TaskApp
      COSMOS_TASKS_CONTAINER_NAME: Tasks
      COSMOS_FORM_SETTINGS_CONTAINER_NAME: FormSettings
      ALLOWED_ORIGIN: http://localhost:5173
    depends_on:
      cosmos:
        condition: service_healthy
    restart: 'no'

  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    ports:
      - '8081:8081'
      - '8080:8080'
      - '1234:1234'
    volumes:
      - cosmos-data:/data
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:8080/ready']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: >-
      azurite
      --blobHost 0.0.0.0
      --queueHost 0.0.0.0
      --tableHost 0.0.0.0
      --location /data
    ports:
      - '10000:10000'
      - '10001:10001'
      - '10002:10002'
    volumes:
      - azurite-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('http').get('http://127.0.0.1:10000/devstoreaccount1?comp=list',
          response => process.exit(response.statusCode < 500 ? 0 : 1))
          .on('error', () => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  cosmos-data:
  azurite-data:
